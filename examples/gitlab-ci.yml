stages:
  - validate

validate-codex-marketplace:
  stage: validate
  image: node:20
  before_script:
    - npm ci
  script:
    - npx cc-to-codex-marketplace check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .claude-plugin/marketplace.json
        - .agents/**/*
        - codex/**/*
